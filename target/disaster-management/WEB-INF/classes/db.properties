# ========================================================
# Database Configuration - Disaster Management System
# ========================================================

# Primary Database Settings (MySQL 8.x)
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/disaster_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.username=root
db.password=root

# HikariCP Connection Pool Settings
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=300000
db.pool.connectionTimeout=10000
db.pool.maxLifetime=1800000

# Standalone Fallback / Embedded Testing Mode
# When set to true, if MySQL is not reachable, the system automatically 
# uses H2 (MySQL Mode) with schema & demo seeds so development and demos never fail.
db.autoFallbackToH2=true
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:mem:disaster_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
db.fallback.username=sa
db.fallback.password=
